const g=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

async function submitModal(type){
  if(type==='emp'){
    const name=g('f1'),nic=g('f2'),wt=g('f5'),pass=g('f10'),epf=g('f11'),contractType=g('f12');
    if(!name||!nic||!wt||!pass)return alert('Name, NIC, Work Type and Password are required');
    const newBranch=document.getElementById('f13')?.value||BRANCHES[0];
    const newPhoto=window._newEmpPhoto||''; window._newEmpPhoto=null;
    D.emp.push({id:'E'+String(Date.now()).slice(-7),name,nic,branch:newBranch,photo:newPhoto,phone:g('f3'),epf,contractType,position:g('f4'),workType:wt,joined:g('f8'),salary:Number(g('f7'))||0,status:g('f9')||'Active',pass});
    await sync('employees',D.emp);updateCount();toast('Employee added successfully ✓');closeModal();rEmp();
  }else if(type==='leave'){
    const empId=g('f1'),leaveType=g('f2'),from=g('f4');
    if(!empId||!leaveType||!from)return alert('Employee, leave type and from date are required');
    D.leaves.unshift({id:'L'+Date.now(),empId,leaveType,from,to:g('f5'),days:g('f3'),reason:g('f6'),status:'Pending',created:now()});
    await sync('leaves',D.leaves);toast('Leave request submitted');closeModal();rLeaves();
  }else if(type==='adv'){
    const empId=g('f1'),amount=g('f2');
    if(!empId||!amount)return alert('Employee and amount are required');
    D.adv.unshift({id:'A'+Date.now(),empId,amount:Number(amount),repayMonths:g('f3'),reason:g('f4'),status:'Pending',requestDate:now()});
    await sync('advances',D.adv);toast('Advance request submitted');closeModal();rAdv();
  }else if(type==='work'){
    const empId=g('f1'),date=g('f2'),wt=g('f3');
    if(!empId||!date||!wt)return alert('Employee, date and work type are required');
    D.work.unshift({id:'W'+Date.now(),empId,date,workType:wt,location:g('f4'),hours:Number(g('f5'))||8,ot:g('f6')==='1',notes:g('f7')});
    await sync('work',D.work);toast('Work record added ✓');closeModal();rWork();
  }
}

function exportData(){
  const data={

    settings: [{id:'WORK_TYPES',data:WORK_TYPES},{id:'ADMIN_PASS',data:ADMIN_PASS},{id:'RATES',data:RATES}]
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='SFD_HR_Backup_'+now()+'.json';
  a.click();
  toast('Backup file downloaded — share to other PCs via USB/WhatsApp/Email','info');
}

async function importData(input){
  if(!input.files.length)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      const exportedDate=data.exported?new Date(data.exported).toLocaleString():'unknown date';
      if(!confirm(`Import backup from ${exportedDate}?\n\nThis will REPLACE all current data on this PC.\nAre you sure?`))return;
      if(data.employees){D.emp=data.employees;await sync('employees',D.emp);}
      if(data.leaves){D.leaves=data.leaves;await sync('leaves',D.leaves);}
      if(data.advances){D.adv=data.advances;await sync('advances',D.adv);}
      if(data.work){D.work=data.work;await sync('work',D.work);}
      if(data.attendance){D.attendance=data.attendance;await sync('attendance',D.attendance);}
      if(data.settings){
        const wtSetting = data.settings.find(s=>s.id==='WORK_TYPES');
        const apSetting = data.settings.find(s=>s.id==='ADMIN_PASS');
        if(wtSetting && wtSetting.data) {
          const raw=wtSetting.data;
          WORK_TYPES=typeof raw[0]==='string'?raw.map(n=>({name:n,day:RATES.day||300,night:RATES.night||500,both:RATES.both||800})):raw;
        }
        if(apSetting) { ADMIN_PASS = apSetting.data; }
        const rateSetting = data.settings.find(s=>s.id==='RATES');
        if(rateSetting) { RATES = rateSetting.data; }
        await sync('settings', data.settings);
      }
      updateCount();render(curPage);
      toast('Data imported successfully! All records restored ✓','ok');
    }catch(err){toast('Invalid backup file — please use a valid export','err');}
    input.value='';
  };
  reader.readAsText(input.files[0]);
}

function exXLS(type){
  let data,name;
  
  const fAdv = D.adv.filter(a => a.requestDate >= repStart && a.requestDate <= repEnd);
  const fLeaves = D.leaves.filter(l => l.from >= repStart && l.from <= repEnd);
  const fWork = D.work.filter(w => w.date >= repStart && w.date <= repEnd);
  const fAtt = D.attendance.filter(a => a.date >= repStart && a.date <= repEnd);

  if(type==='emp'){data=D.emp.map(e=>({'ID':e.id,'Name':e.name,'EPF/ETF':e.epf,'NIC':e.nic,'Phone':e.phone,'Contract':e.contractType,'Work Type':e.workType,'Position':e.position,'Appointment Date':e.joined,'Salary (Rs)':e.salary,'Status':e.status}));name='Employees';}
  else if(type==='leaves'){data=fLeaves.map(l=>({'ID':l.id,'Employee':gname(l.empId),'Leave Type':l.leaveType,'From':l.from,'To':l.to,'Days':l.days,'Reason':l.reason,'Status':l.status}));name='Leaves';}
  else if(type==='adv'){data=fAdv.map(a=>({'ID':a.id,'Employee':gname(a.empId),'Amount (Rs)':a.amount,'Request Date':a.requestDate,'Reason':a.reason,'Repay Months':a.repayMonths,'Status':a.status}));name='Advances';}
  else if(type==='attendance'){data=fAtt.map(a=>({'ID':a.id,'Employee':gname(a.empId),'Date':a.date,'Status':a.status}));name='Attendance';}
  else{data=fWork.map(w=>({'ID':w.id,'Employee':gname(w.empId),'Date':w.date,'Work Type':w.workType,'Location':w.location,'Hours':w.hours,'Overtime':w.ot?'Yes':'No','Notes':w.notes}));name='WorkRecords';}
  
  if(!data.length)return toast('No records found for the selected date range','err');
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,name);
  XLSX.writeFile(wb,'SFD_'+name+'_'+now()+'.xlsx');
  toast('Excel file downloaded!','ok');
}

// ── SEED DUMMY ATTENDANCE & ADVANCE DATA ────────────────────────────────────
async function seedDummyData(){
  if(D.attendance.length > 0) return; // Already has data
  
  const today = new Date();
  const shifts = ['Day','Night','Both','Day','Day','Day','Night','Day','Absent','Day'];
  const newAtt = [];
  
  // Generate attendance for current month and last month for all employees
  for(let monthOffset=0; monthOffset<=1; monthOffset++){
    const yr = today.getFullYear();
    const mo = today.getMonth() - monthOffset;
    const daysInMo = new Date(yr, mo+1, 0).getDate();
    const upTo = monthOffset===0 ? Math.min(today.getDate(), daysInMo) : daysInMo;
    
    D.emp.forEach((emp, empIdx) => {
      for(let d=1; d<=upTo; d++){
        const dateStr = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dow = new Date(yr,mo,d).getDay();
        if(dow===0) return; // Skip Sundays
        
        // Different patterns per employee
        let status;
        const r = (empIdx + d) % 10;
        if(emp.workType==='Driver'){
          status = ['Day','Night','Night','Day','Both','Day','Day','Night','Absent','Day'][r];
        } else if(emp.workType==='Decorator'){
          status = ['Day','Day','Day','Day','Day','Day','Day','Absent','Day','Day'][r];
        } else {
          status = ['Day','Day','Day','Day','Day','Day','Day','Day','Absent','Day'][r];
        }
        
        newAtt.push({id:'AT'+dateStr.replace(/-/g,'')+emp.id, empId:emp.id, date:dateStr, status});
      }
    });
  }
  
  D.attendance = newAtt;
  await sync('attendance', D.attendance);
  
  // Add dummy advances if none exist
  if(D.adv.length === 0){
    const dummyAdvances = [
      {id:'A001',empId:'E001',amount:15000,repayMonths:3,reason:'Medical emergency',status:'Approved',requestDate:new Date(today.getFullYear(),today.getMonth()-1,10).toISOString().slice(0,10)},
      {id:'A002',empId:'E002',amount:10000,repayMonths:2,reason:'Vehicle repair',status:'Approved',requestDate:new Date(today.getFullYear(),today.getMonth()-1,15).toISOString().slice(0,10)},
      {id:'A003',empId:'E005',amount:8000,repayMonths:4,reason:'Personal needs',status:'Pending',requestDate:new Date(today.getFullYear(),today.getMonth(),5).toISOString().slice(0,10)},
    ];
    D.adv = dummyAdvances;
    await sync('advances', D.adv);
  }
  
  toast('Demo attendance & advance data loaded ✓', 'info');
}

function compressPhoto(file, maxW, maxH, quality, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW/w, maxH/h);
      if(ratio < 1) { w = Math.round(w*ratio); h = Math.round(h*ratio); }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function previewEmpPhoto(input) {
  const file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024) { toast('Photo too large — max 2MB','err'); return; }
  compressPhoto(file, 300, 300, 0.8, data => {
    window._empPhotoData = data;
    const preview = document.getElementById('ef-photo-preview');
    if(preview) preview.innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
  });
}

function shiftPayMonth(delta) {
  const [y, m] = payMonth.split('-').map(Number);

  payMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

// Get all months with attendance data for this branch
function getAttendanceMonths() {
  const months = new Set();
  D.attendance
    .filter(a => {
      const emp = D.emp.find(e => e.id === a.empId);
      return emp && (emp.branch || BRANCHES[0]) === currentBranch;
    })
    .forEach(a => months.add(a.date.slice(0, 7)));
  return [...months].sort().reverse();
}

    });
    // iOS: prevent body scroll when modal is open
    document.addEventListener('touchmove', e => {
      if(document.getElementById('modal-bg')?.classList.contains('open')){
        if(!e.target.closest('.modal-box')) e.preventDefault();
      }
    }, {passive:false});
  }
  // ── iOS sidebar swipe gesture ───────────────────────────────
  if(isIOS || window.innerWidth <= 768){
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive:true});
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = Math.abs(e.changedTouches[0].screenY - touchStartY);
      if(dy > 60) return; // vertical scroll, ignore
      const sb = document.getElementById('sidebar');
      if(!sb) return;
      // Swipe right from left edge → open sidebar
      if(dx > 70 && touchStartX < 30) { sb.classList.add('open'); }
      // Swipe left → close sidebar
      if(dx < -70 && sb.classList.contains('open')) { sb.classList.remove('open'); }
    }, {passive:true});
  }
  document.getElementById('hdr-date').textContent=new Date().toDateString();
  // Enter key login
  ['l-user','l-pass'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  });
  // ← → keyboard navigation for attendance date + payroll month
  document.addEventListener('keydown', e => {
    const active = document.querySelector('.page.active');
    if(!active) return;
    const pid = active.id.replace('page-','');
    // Only when not typing in an input
    if(document.activeElement && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if(pid === 'attendance') {
      if(e.key === 'ArrowLeft')  { shiftAttDay(-1);  e.preventDefault(); }
      if(e.key === 'ArrowRight') { shiftAttDay(1);   e.preventDefault(); }
      if(e.key === 't' || e.key === 'T') { attDate=toISOLoc(new Date()); rAtt(); }
    }
    if(pid === 'payroll') {
      if(e.key === 'ArrowLeft')  { shiftPayMonth(-1); e.preventDefault(); }
      if(e.key === 'ArrowRight') { shiftPayMonth(1);  e.preventDefault(); }
    }
  });
  loadFBConfig(); // config is hardcoded
  try{
    await initDB();
    await initFirebase(); // always connect - config hardcoded
    await loadAll();
  }catch(e){
    console.error('DB init failed, using memory:',e);
    D.emp=SEED;D.leaves=[];D.adv=[];D.work=[];D.attendance=[];
  }
  updateCount();
  updateNavBadges();
  // Set initial branch button styles
  try {
    const isDir = currentBranch === BRANCHES[0];
    const bdBtn = document.getElementById('bb-directors');
    const bsBtn = document.getElementById('bb-shop');
    if(bdBtn){ bdBtn.style.background=isDir?'var(--primary)':'transparent'; bdBtn.style.color=isDir?'#fff':'var(--text2)'; bdBtn.style.borderColor=isDir?'var(--primary)':'var(--bor)'; }
    if(bsBtn){ bsBtn.style.background=!isDir?'var(--gold)':'transparent'; bsBtn.style.color=!isDir?'#000':'var(--text2)'; bsBtn.style.borderColor=!isDir?'var(--gold)':'var(--bor)'; }
  } catch(e){ console.warn('Branch init:', e); }
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

// ── Category Modal Helpers ─────────────────────────────────
// ── MULTI-JOB ATTENDANCE ─────────────────────────────────────
function openAddJobModal(empId){
  // Employee must have attendance marked first
  const a = D.attendance.find(x=>x.empId===empId && x.date===attDate);
  if(!a || a.status==='Absent' || a.status==='Not Marked') {
    toast('Mark attendance first to add a job','err'); return;
  }
  openModal('addjob', empId);
}

async function saveAddJob(empId){
  const category = document.getElementById('job-cat')?.value;
  const type     = document.getElementById('job-type')?.value || 'Day';
  const rate     = parseInt(document.getElementById('job-rate')?.value)||0;
  const desc     = document.getElementById('job-desc')?.value.trim()||'';
  if(!category) return toast('Please select a work category','err');
  if(!rate)     return toast('Please enter a job rate','err');
  
  let a = D.attendance.find(x=>x.empId===empId && x.date===attDate);
  if(!a){ toast('Attendance record not found','err'); return; }
  
  if(!a.jobs) a.jobs = [];
  a.jobs.push({ jobId:'J'+Date.now(), category, type, rate, desc });
  
  await sync('attendance', D.attendance);
  closeModal();
  toast(category+' '+type+' — Rs.'+rate+(desc?' ('+desc+')':'')+' added!','ok');
  rAtt();
}

function updateJobRate(catName){
  const type = document.getElementById('job-type')?.value||'Day';
  const wt   = WORK_TYPES.find(w=>(w.name||w)===catName);
  if(!wt || typeof wt!=='object') return;
  const rate = type==='Day'?(wt.day||0):type==='Night'?(wt.night||0):(wt.both||0);
  const rateEl = document.getElementById('job-rate');
  if(rateEl) rateEl.value = rate;
}

async function removeJob(empId, jobIdx){
  const a = D.attendance.find(x=>x.empId===empId && x.date===attDate);
  if(!a || !a.jobs) return;
  a.jobs.splice(jobIdx, 1);
  await sync('attendance', D.attendance);
  rAtt();
}


async function resetDefaultCats(){
  WORK_TYPES = DEFAULT_WORK_TYPES.map(w=>({...w}));
  await sync('settings',[{id:'WORK_TYPES',data:WORK_TYPES}]);
  toast('Default categories loaded!','ok');
  rSettings();
}

function openAddCatModal(){ openModal('addcat'); }
function openEditCatModal(idx){ openModal('editcat',idx); }


init();

</script>
